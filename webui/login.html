<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 服务器桌面</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1014;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
form{width:100%;max-width:340px;background:#151c24;border-radius:16px;padding:22px}
h1{font-size:17px;margin:0 0 4px}
p{color:#8b98a5;font-size:12px;margin:0 0 16px}
input{width:100%;padding:12px;border-radius:11px;border:0;background:#0b1014;color:#e6edf3;font-size:16px;margin-bottom:12px}
button{width:100%;padding:12px;border:0;border-radius:11px;background:#1e6fd9;color:#fff;font-size:15px;cursor:pointer}
.err{color:#ff6b6b;font-size:12px;margin-bottom:10px;display:none}
.err.on{display:block}
</style></head><body>
<form method="post" action="/login">
  <h1>服务器桌面</h1>
  <p>请输入访问口令</p>
  <div class="err" id="e">口令不对，再试一次</div>
  <input type="password" name="pass" id="p" placeholder="口令" autocomplete="current-password" autofocus>
  <button type="submit">进入</button>
</form>
<script>
if(location.search.indexOf('e=1')>=0)document.getElementById('e').className='err on';
</script></body></html>
