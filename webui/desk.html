<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>服务器桌面</title>
<style>
:root{--bg:#0b1014;--card:#151c24;--tx:#e6edf3;--dim:#8b98a5;--grn:#3ddc84;--red:#ff6b6b;--blu:#4da3ff;--amb:#ffc857}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
h1{font-size:18px;margin:0;flex:1}
a.out{color:var(--dim);font-size:12px;text-decoration:none}
.sub{color:var(--dim);font-size:12px;margin:2px 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:9px;border:0;border-radius:10px;background:var(--card);color:var(--dim);font-size:13px;cursor:pointer}
nav button.on{background:#1e2a38;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:11px 13px}
.card .t{font-size:11px;color:var(--dim)}
.card .v{font-size:20px;font-weight:700;margin-top:3px}
.card .s{font-size:11px;color:var(--dim);margin-top:2px}
.g{color:var(--grn)}.r{color:var(--red)}.b{color:var(--blu)}.a{color:var(--amb)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row button{flex:1;min-width:120px;padding:10px;border:0;border-radius:11px;background:var(--card);color:var(--tx);font-size:13px;cursor:pointer}
.row button:active{background:#233040}
pre{background:#07090c;border-radius:12px;padding:10px;height:60vh;overflow:auto;font-size:11px;line-height:1.45;color:#9be3a8;white-space:pre-wrap;word-break:break-all;margin:0}
.msgs{height:58vh;overflow:auto;padding:2px}
.who{font-size:10px;color:var(--dim);margin:8px 4px 1px}
.msg{max-width:80%;margin:4px 0;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word;display:inline-block}
.msgline{clear:both}
.msg.ai{background:#1e2a38;float:left}
.msg.me{background:#1f4d36;float:right}
.st{font-size:11px;opacity:.9;display:block;margin-top:3px}
.st.p{color:var(--amb)}.st.e{color:var(--red)}.st.s{color:var(--grn)}
.inrow{display:flex;gap:8px;margin-top:8px}
.inrow input{flex:1;padding:11px;border-radius:11px;border:0;background:var(--card);color:var(--tx);font-size:14px}
.inrow button{padding:11px 16px;border:0;border-radius:11px;background:#1e6fd9;color:#fff;font-size:14px;cursor:pointer}
select{background:var(--card);color:var(--tx);border:0;border-radius:10px;padding:9px}
.hint{color:var(--dim);font-size:11px;margin-top:8px}
</style></head><body>
<header><h1>服务器桌面</h1><a class="out" href="/logout">退出</a></header>
<div class="sub">手机 <span id="ph">—</span> · 公网访问 · <span id="clock">—</span></div>

<nav>
  <button id="tb-s" class="on" onclick="tab('s')">状态</button>
  <button id="tb-l" onclick="tab('l')">日志</button>
  <button id="tb-m" onclick="tab('m')">消息</button>
</nav>

<section id="pg-s">
  <div class="grid" id="cards"></div>
  <div class="row">
    <button onclick="svc('astrbot','restart')">重启 AstrBot</button>
    <button onclick="svc('napcat','restart')">重启 NapCat</button>
  </div>
  <div class="row">
    <button onclick="svc('astrbot','start')">启动 AstrBot</button>
    <button onclick="svc('napcat','start')">启动 NapCat</button>
  </div>
  <div class="hint" id="thint"></div>
</section>

<section id="pg-l" style="display:none">
  <div class="row" style="margin:0 0 8px">
    <select id="which" onchange="loadLogs()">
      <option value="napcat">NapCat</option>
      <option value="astrbot">AstrBot</option>
    </select>
    <button onclick="loadLogs()">刷新</button>
  </div>
  <pre id="log">读取中…</pre>
</section>

<section id="pg-m" style="display:none">
  <div class="msgs" id="msgs"></div>
  <div class="inrow">
    <input id="txt" placeholder="说点什么…" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
  <div class="hint" id="mhint"></div>
</section>

<script>
let cur='s';
function el(id){return document.getElementById(id);}
async function G(p){
  const r=await fetch(p,{cache:'no-store',credentials:'same-origin'});
  if(r.status===401){location.href='/login';throw new Error('unauth');}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.json();
}
function tab(t){
  cur=t;
  ['s','l','m'].forEach(function(k){
    el('pg-'+k).style.display=(k===t?'block':'none');
    el('tb-'+k).className=(k===t?'on':'');
  });
  if(t==='s')loadStatus();
  if(t==='l')loadLogs();
  if(t==='m')loadChat();
}
function card(t,v,s,cls){return '<div class="card"><div class="t">'+t+'</div><div class="v '+(cls||'')+'">'+v+'</div><div class="s">'+(s||'')+'</div></div>';}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function loadStatus(){
  try{
    const j=await G('/api/status');
    const sv=j.services||{};
    const on=function(b){return b?'在线':'离线';};
    let h='';
    h+=card('电量',(j.battery?j.battery.pct:-1)+'%',(j.battery&&j.battery.charging?'充电中':'未充电')+' · '+(j.battery?j.battery.temp_c:'-')+'℃',(j.battery&&j.battery.pct>=80?'g':''));
    h+=card('内存',(j.ram?j.ram.used_mb:'-')+' / '+(j.ram?j.ram.total_mb:'-')+' MB','已用');
    h+=card('存储',(j.storage?j.storage.avail_gb:'-')+' GB 可用','共 '+(j.storage?j.storage.total_gb:'-')+' GB');
    h+=card('运行时长',fmtUp(j.uptime_s),'自上次开机');
    h+=card('AstrBot',on(sv.astrbot),'端口 6185',sv.astrbot?'g':'r');
    h+=card('NapCat',on(sv.napcat),'端口 6099',sv.napcat?'g':'r');
    h+=card('SSH',on(sv.ssh),'端口 8022',sv.ssh?'g':'r');
    h+=card('Token','<span id="tk">…</span>','NapCat WebUI');
    el('cards').innerHTML=h;
    el('ph').textContent=j.ip||'—';
    el('clock').textContent=new Date().toLocaleTimeString('zh-CN');
    loadToken();
  }catch(e){
    el('cards').innerHTML='<div class="card"><div class="t">手机</div><div class="v r">离线</div><div class="s">'+esc(String(e))+'</div></div>';
  }
}
async function loadToken(){
  try{const j=await G('/api/token');el('tk').textContent=j.token||'无';}catch(e){}
}
function fmtUp(s){
  if(s==null)return '-';
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return (d>0?d+'天':'')+h+'时'+m+'分';
}
async function loadLogs(){
  const w=el('which').value;
  try{
    const j=await G('/api/logs?which='+w+'&lines=120');
    el('log').textContent=(j.ok?'':'[读取失败] ')+j.text;
    el('log').scrollTop=el('log').scrollHeight;
  }catch(e){el('log').textContent='读取失败：'+e;}
}
async function loadChat(){
  try{
    const j=await G('/api/chat?limit=100');
    let h='';
    if(j.pending>0)h+='<div class="hint">有 '+j.pending+' 条消息在等待应答…</div>';
    (j.messages||[]).forEach(function(m){
      const ai=(m.role==='ai');
      let st='';
      if(!ai&&m.status==='pending')st='<span class="st p">⏳ 等待应答</span>';
      else if(!ai&&m.status==='error')st='<span class="st e">⚠ '+esc(m.err||'失败')+'</span>';
      h+='<div class="who" style="text-align:'+(ai?'left':'right')+'">'+(ai?'助手':'我')+' · '+fmtT(m.ts)+'</div>';
      h+='<div class="msgline" style="text-align:'+(ai?'left':'right')+'"><div class="msg '+(ai?'ai':'me')+'">'+esc(m.text)+st+'</div></div>';
    });
    const box=el('msgs');
    const atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-60;
    box.innerHTML=h||'<div class="hint">还没有消息</div>';
    if(atBottom)box.scrollTop=box.scrollHeight;
  }catch(e){el('msgs').innerHTML='<div class="hint">加载失败：'+esc(String(e))+'</div>';}
}
function fmtT(t){const d=new Date(t);const p=function(n){return (n<10?'0':'')+n;};return p(d.getHours())+':'+p(d.getMinutes());}
async function send(){
  const t=el('txt').value.trim();
  if(!t)return;
  el('mhint').textContent='发送中…';
  try{
    const r=await fetch('/api/send?text='+encodeURIComponent(t),{credentials:'same-origin'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    el('txt').value='';
    el('mhint').textContent='已发送';
    await loadChat();
  }catch(e){el('mhint').textContent='发送失败：'+e;}
}
async function svc(name,action){
  if(action==='restart'&&!confirm('重启 '+name+'？会中断当前服务'))return;
  el('thint').textContent='正在'+action+' '+name+' …';
  try{
    const j=await G('/api/svc?name='+name+'&action='+action);
    el('thint').textContent=(j.ok?'已执行':'失败')+': '+name+' '+action+' · running='+j.running;
  }catch(e){el('thint').textContent='请求失败：'+e;}
}
loadStatus();setInterval(function(){if(cur==='s')loadStatus();},5000);
setInterval(function(){if(cur==='l')loadLogs();},4000);
setInterval(function(){if(cur==='m')loadChat();},3000);
</script></body></html>
